name: Deploy Microservices to Azure Container Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ACR_NAME: railwayacr4601
  RESOURCE_GROUP: railway-resource
  LOCATION: southeastasia

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: api-gateway
            dockerfile: src/Gateway/ApiGateway/Dockerfile
          - service: auth-api
            dockerfile: src/Services/Authentication/Auth.API/Dockerfile
          - service: usermanagement-api
            dockerfile: src/Services/UserManagement/UserManagement.API/Dockerfile
          - service: admin-api
            dockerfile: src/Services/Admin/Admin.API/Dockerfile
          - service: booking-api
            dockerfile: src/Services/Booking/Booking.API/Dockerfile
          - service: payment-api
            dockerfile: src/Services/Payment/Payment.API/Dockerfile
          - service: notification-api
            dockerfile: src/Services/Notification/Notification.API/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: dotnet build --configuration Release

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set short SHA for versioning
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: ACR Login
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.ACR_NAME }}.azurecr.io/${{ matrix.service }}:${{ env.SHORT_SHA }}
            ${{ env.ACR_NAME }}.azurecr.io/${{ matrix.service }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: api-gateway
          - service: auth-api
          - service: usermanagement-api
          - service: admin-api
          - service: booking-api
          - service: payment-api
          - service: notification-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set short SHA for versioning
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Deploy Container App
        uses: azure/container-apps-deploy-action@v1
        with:
          imageToDeploy: ${{ env.ACR_NAME }}.azurecr.io/${{ matrix.service }}:${{ env.SHORT_SHA }}
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppName: railway-${{ matrix.service }}
          environmentVariables: |
            ASPNETCORE_ENVIRONMENT=Production

      - name: Get Deployed App URL
        run: |
          az containerapp show \
            --name railway-${{ matrix.service }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn \
            --output tsv

