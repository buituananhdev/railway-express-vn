name: Deploy Microservices to Azure Container Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ACR_NAME: railwayacr4601
  RESOURCE_GROUP: railway-resource
  LOCATION: southeastasia
  VERSION: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: api-gateway
            dockerfile: src/Gateway/ApiGateway/Dockerfile
            port: 80
            ingress: external
            
          - service: auth-api
            dockerfile: src/Services/Authentication/Auth.API/Dockerfile
            port: 80
            ingress: external
            
          - service: usermanagement-api
            dockerfile: src/Services/UserManagement/UserManagement.API/Dockerfile
            port: 80
            ingress: external
            
          - service: admin-api
            dockerfile: src/Services/Admin/Admin.API/Dockerfile
            port: 80
            ingress: external
            
          - service: booking-api
            dockerfile: src/Services/Booking/Booking.API/Dockerfile
            port: 80
            ingress: external
            
          - service: payment-api
            dockerfile: src/Services/Payment/Payment.API/Dockerfile
            port: 80
            ingress: external

          - service: notification-api
            dockerfile: src/Services/Notification/Notification.API/Dockerfile
            port: 80
            ingress: external

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set short SHA for versioning
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: ACR Login
        run: az acr login --name $ACR_NAME

      - name: Build and Push Image
        run: |
          echo "Building and pushing ${{ matrix.service }}:$SHORT_SHA"
          docker build -t $ACR_NAME.azurecr.io/${{ matrix.service }}:$SHORT_SHA -t $ACR_NAME.azurecr.io/${{ matrix.service }}:latest -f ${{ matrix.dockerfile }} .
          docker push $ACR_NAME.azurecr.io/${{ matrix.service }}:$SHORT_SHA
          docker push $ACR_NAME.azurecr.io/${{ matrix.service }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: api-gateway
            port: 80
            ingress: external
            min_replicas: 1
            max_replicas: 5
            cpu: 0.5
            memory: "1Gi"
            
          - service: auth-api
            port: 80
            ingress: external
            min_replicas: 1
            max_replicas: 3
            cpu: 0.5
            memory: "1Gi"
            
          - service: usermanagement-api
            port: 80
            ingress: external
            min_replicas: 1
            max_replicas: 3
            cpu: 0.5
            memory: "1Gi"
            
          - service: admin-api
            port: 80
            ingress: external
            min_replicas: 1
            max_replicas: 3
            cpu: 0.5
            memory: "1Gi"
            
          - service: booking-api
            port: 80
            ingress: external
            min_replicas: 1
            max_replicas: 3
            cpu: 0.5
            memory: "1Gi"
            
          - service: payment-api
            port: 80
            ingress: external
            min_replicas: 1
            max_replicas: 3
            cpu: 0.5
            memory: "1Gi"

          - service: notification-api
            port: 80
            ingress: external
            min_replicas: 1
            max_replicas: 3
            cpu: 0.5
            memory: "1Gi"

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set short SHA for versioning
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Check if Container App exists
        id: check_app
        continue-on-error: true
        run: |
          EXISTS=$(az containerapp show --name railway-${{ matrix.service }} --resource-group $RESOURCE_GROUP --query name -o tsv 2>/dev/null || echo "false")
          if [ "$EXISTS" != "false" ]; then
            echo "Container app exists, will update"
            echo "app_exists=true" >> $GITHUB_OUTPUT
          else
            echo "Container app does not exist, will create"
            echo "app_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Container App Environment if not exists
        id: environment
        run: |
          ENV_EXISTS=$(az containerapp env list --resource-group $RESOURCE_GROUP --query "[?name=='railway-env'].name" -o tsv)
          if [ -z "$ENV_EXISTS" ]; then
            echo "Creating Container App Environment"
            az containerapp env create \
              --name railway-env \
              --resource-group $RESOURCE_GROUP \
              --location $LOCATION
          else
            echo "Container App Environment already exists"
          fi
          echo "env_name=railway-env" >> $GITHUB_OUTPUT

      - name: Create Container App
        if: steps.check_app.outputs.app_exists != 'true'
        run: |
          az containerapp create \
            --name railway-${{ matrix.service }} \
            --resource-group $RESOURCE_GROUP \
            --environment ${{ steps.environment.outputs.env_name }} \
            --image mcr.microsoft.com/oss/nginx/nginx:1.15.5-alpine \
            --ingress ${{ matrix.ingress }} \
            --target-port ${{ matrix.port }} \
            --min-replicas ${{ matrix.min_replicas }} \
            --max-replicas ${{ matrix.max_replicas }} \
            --cpu ${{ matrix.cpu }} \
            --memory ${{ matrix.memory }} \
            --env-vars "SERVICE_VERSION=init" "ENVIRONMENT=production" \
            --revision-suffix init \
            --system-assigned

          IDENTITY_OBJECT_ID=$(az containerapp show \
            --name railway-${{ matrix.service }} \
            --resource-group $RESOURCE_GROUP \
            --query "identity.principalId" \
            --output tsv)

          SUBSCRIPTION_ID=$(az account show --query id -o tsv)

          az role assignment create \
            --assignee $IDENTITY_OBJECT_ID \
            --role acrpull \
            --scope /subscriptions/$SUBSCRIPTION_ID/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.ContainerRegistry/registries/$ACR_NAME

          az containerapp update \
            --name railway-${{ matrix.service }} \
            --resource-group $RESOURCE_GROUP \
            --image $ACR_NAME.azurecr.io/${{ matrix.service }}:$SHORT_SHA \
            --cpu ${{ matrix.cpu }} \
            --memory ${{ matrix.memory }} \
            --set-env-vars SERVICE_VERSION=$SHORT_SHA ENVIRONMENT=production \
            --revision-suffix $SHORT_SHA

      - name: Update Container App
        if: steps.check_app.outputs.app_exists == 'true'
        run: |
          az containerapp update \
            --name railway-${{ matrix.service }} \
            --resource-group $RESOURCE_GROUP \
            --image $ACR_NAME.azurecr.io/${{ matrix.service }}:$SHORT_SHA \
            --cpu ${{ matrix.cpu }} \
            --memory ${{ matrix.memory }} \
            --set-env-vars SERVICE_VERSION=$SHORT_SHA ENVIRONMENT=production \
            --revision-suffix $SHORT_SHA
