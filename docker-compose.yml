version: '3.4'

services:
  apigateway:
    image: ${DOCKER_REGISTRY-}apigateway
    build:
      context: .
      dockerfile: src/Gateway/ApiGateway/Dockerfile

  admin.api:
    image: ${DOCKER_REGISTRY-}adminapi
    build:
      context: .
      dockerfile: src/Services/Admin/Admin.API/Dockerfile


  booking.api:
    image: ${DOCKER_REGISTRY-}bookingapi
    build:
      context: .
      dockerfile: src/Services/Booking/Booking.API/Dockerfile


  notification.api:
    image: ${DOCKER_REGISTRY-}notificationapi
    build:
      context: .
      dockerfile: src/Services/Notification/Notification.API/Dockerfile


  passenger.api:
    image: ${DOCKER_REGISTRY-}passengerapi
    build:
      context: .
      dockerfile: src/Services/Passenger/Passenger.API/Dockerfile


  payment.api:
    image: ${DOCKER_REGISTRY-}paymentapi
    build:
      context: .
      dockerfile: src/Services/Payment/Payment.API/Dockerfile


  trainschedule.api:
    image: ${DOCKER_REGISTRY-}trainscheduleapi
    build:
      context: .
      dockerfile: src/Services/TrainSchedule/TrainSchedule.API/Dockerfile

